# Base de datos exclusiva para pruebas
spring.datasource.url=jdbc:h2:mem:smarthelpdesk_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# Crear y eliminar tablas durante las pruebas
spring.jpa.hibernate.ddl-auto=create-drop
# Mostrar las consultas SQL
spring.jpa.show-sql=true
# Desactivar la consola H2 durante las pruebas
spring.h2.console.enabled=false